spring.application.name=backend
server.port=${SERVER_PORT}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url =jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
google.client-id=${GOOGLE_CLIENT}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_SECRET}
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_SECRET}
spring.security.oauth2.client.registration.google.scope[0]=email
spring.security.oauth2.client.registration.google.scope[1]=profile
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
spring.security.oauth2.client.registration.github.scope[0]=user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

storage.s3.endpoint =${S3_ENDPOINT:http://localhost:8333}
storage.s3.region=${S3_REGION:us-east-1}
storage.s3.access-key=${S3_ACCESS_KEY:dev}
storage.s3.secret-key=${S3_SECRET_KEY:dev}
storage.s3.bucket=${S3_BUCKET:cvs}
storage.s3.path.style=${S3_PATH_STYLE:true}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB