name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]    

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SERVER_PORT: 8080
      POSTGRES_DB: jobtrail
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      GOOGLE_CLIENT: ci-placeholder
      GOOGLE_SECRET: ci-placeholder
      GITHUB_CLIENT: ci-placeholder
      GITHUB_SECRET: ci-placeholder
      JWT_SECRET: ci-placeholder-secret-at-least-32-bytes-long
      GEMINI_API_KEY: ci-placeholder
    services:
      postgres:
        image: postgres:17.0
        env:
          POSTGRES_DB: jobtrail
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
              distribution: temurin
              java-version: '25'
              cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build
      
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/build/reports/tests/test